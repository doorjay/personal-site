<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Test Site - Contact</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="public_css/styles.css" />
  <script src="public_js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Contact</h1>

    <nav aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Form Test</h2>

      <form id="demoForm">
        <label for="nameInput">Name</label>
        <input id="nameInput" name="name" autocomplete="name" />

        <label for="topicSelect">Topic</label>
        <select id="topicSelect" name="topic">
          <option value="analytics">Analytics</option>
          <option value="web">Web</option>
          <option value="security">Security</option>
        </select>

        <fieldset>
          <label>
            <input id="subscribeCheck" type="checkbox" name="subscribe" />
            Subscribe
          </label>
        </fieldset>

        <p>
          <button type="submit">Submit</button>
        </p>
      </form>

      <p id="formStatus" role="status"></p>
    </section>

    <section aria-labelledby="log-heading">
      <h2 id="log-heading">Local Event Log</h2>
      <output id="log" aria-live="polite"></output>
    </section>
  </main>

  <footer>
    <small>Test site for analytics assignment.</small>
  </footer>
</body>
</html>
